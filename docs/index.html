<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Planning Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal-backdrop { background: rgba(0, 0, 0, 0.5); }
        input, textarea { background: #1e293b; border-color: #334155; color: #e2e8f0; }
        input:focus, textarea:focus { outline: none; border-color: #06b6d4; background: #0f172a; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100">

<div id="app" class="min-h-screen flex flex-col">
    <!-- Header -->
    <header class="border-b border-slate-700 bg-slate-800 px-8 py-6">
        <div class="max-w-7xl mx-auto">
            <h1 class="text-3xl font-light tracking-tight">Event Dashboard</h1>
            <p class="text-slate-400 mt-2">Central hub for all your event planning</p>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar: Events List -->
        <aside class="w-72 border-r border-slate-700 bg-slate-800 overflow-y-auto">
            <div class="p-6">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-lg font-semibold">Events</h2>
                    <button onclick="addEvent()" class="p-2 hover:bg-slate-700 rounded text-cyan-400">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                    </button>
                </div>

                <div id="eventsList" class="space-y-3"></div>
            </div>
        </aside>

        <!-- Main Content -->
        <main id="mainContent" class="flex-1 overflow-y-auto">
            <div id="selectedEvent" class="fade-in"></div>
            <div id="emptyState" class="flex items-center justify-center h-full">
                <p class="text-slate-400">Select an event to get started</p>
            </div>
        </main>
    </div>
</div>

<!-- Edit Modal -->
<div id="editModal" class="hidden fixed inset-0 modal-backdrop flex items-center justify-center z-50">
    <div class="bg-slate-800 rounded-lg p-8 max-w-md w-full border border-slate-700">
        <h2 id="modalTitle" class="text-xl font-semibold mb-4"></h2>
        <input id="modalInput" type="text" class="w-full px-3 py-2 rounded border mb-4">
        <div class="flex gap-3">
            <button onclick="saveEdit()" class="flex-1 bg-cyan-600 hover:bg-cyan-700 px-4 py-2 rounded font-medium">Save</button>
            <button onclick="closeModal()" class="flex-1 bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded font-medium">Cancel</button>
        </div>
    </div>
</div>

<script>
let events = [
    {
        id: 'gala-2027-spring',
        name: 'Spring Fundraiser Gala',
        date: '2027-03-15',
        location: 'The Meadows Venue, Greensboro, NC',
        type: 'team',
        status: 'in-progress',
        budget: { total: 5300, actual: 4275 },
        tasksCompleted: 2,
        tasksTotal: 6,
        upcomingDeadline: '2026-10-08',
        timeline: [
            { time: '4:00 PM', activity: 'Setup begins', owner: 'Sarah (Volunteer Lead)', notes: 'AV testing, table setup' },
            { time: '5:30 PM', activity: 'Doors open', owner: 'Marcus', notes: 'Check-in & registration' },
            { time: '6:00 PM', activity: 'Welcome remarks', owner: 'Carrie', notes: '10 mins' },
            { time: '6:45 PM', activity: 'Catering begins', owner: 'Trenton Events', notes: '336-555-0123' },
            { time: '7:45 PM', activity: 'Closing remarks', owner: 'Carrie', notes: '5 mins' },
            { time: '8:30 PM', activity: 'Breakdown', owner: 'Team', notes: 'Complete by 9:15 PM' }
        ],
        budget_lines: [
            { category: 'Venue', budgeted: 1500, actual: 1500, status: 'on-track' },
            { category: 'Catering', budgeted: 2000, actual: 1950, status: 'on-track' },
            { category: 'AV & Tech', budgeted: 600, actual: 600, status: 'on-track' },
            { category: 'Permits & Insurance', budgeted: 150, actual: 150, status: 'on-track' },
            { category: 'Marketing', budgeted: 150, actual: 75, status: 'on-track' }
        ],
        tasks: [
            { id: 'PERMIT-001', title: 'Submit city event permit', status: 'pending', due: '2026-10-15', priority: 'high' },
            { id: 'VENDOR-001', title: 'Confirm primary caterer', status: 'pending', due: '2026-10-22', priority: 'high' },
            { id: 'BUDGET-001', title: 'Finalize budget', status: 'in-progress', due: '2026-10-08', priority: 'high' },
            { id: 'LOGISTICS-001', title: 'Confirm venue floor plan', status: 'pending', due: '2026-10-25', priority: 'high' },
            { id: 'COMMS-001', title: 'Draft volunteer email', status: 'pending', due: '2026-10-01', priority: 'medium' }
        ],
        vendors: [
            { name: 'Trenton Events', service: 'Catering', contact: '336-555-0123', email: 'info@trentonevents.com', status: 'confirmed' },
            { name: 'Clarity Audio', service: 'AV & Sound', contact: '336-555-0456', email: 'booking@clarityaudio.com', status: 'confirmed' },
            { name: 'The Meadows Venue', service: 'Venue', contact: '336-555-0789', email: 'events@themeadows.com', status: 'confirmed' }
        ]
    }
];

let selectedEventId = 'gala-2027-spring';
let currentTab = 'overview';
let editingField = null;

function formatDate(dateStr) {
    return new Date(dateStr).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function getProgressPercent(completed, total) {
    return Math.round((completed / total) * 100);
}

function renderEventsList() {
    const list = document.getElementById('eventsList');
    list.innerHTML = events.map(event => {
        const progress = getProgressPercent(event.tasksCompleted, event.tasksTotal);
        const isSelected = event.id === selectedEventId;
        return `
            <button onclick="selectEvent('${event.id}')" 
                class="w-full text-left p-4 rounded-lg transition-colors ${isSelected ? 'bg-slate-700 border-l-2 border-cyan-400' : 'hover:bg-slate-700/50'}">
                <h3 class="font-medium text-sm">${event.name}</h3>
                <p class="text-xs text-slate-400 mt-1">${formatDate(event.date)}</p>
                <div class="mt-3 flex items-center gap-2">
                    <div class="flex-1 bg-slate-600 rounded-full h-2">
                        <div class="bg-cyan-400 h-full rounded-full" style="width: ${progress}%"></div>
                    </div>
                    <span class="text-xs text-slate-300">${event.tasksCompleted}/${event.tasksTotal}</span>
                </div>
            </button>
        `;
    }).join('');
}

function selectEvent(eventId) {
    selectedEventId = eventId;
    currentTab = 'overview';
    renderEventsList();
    renderMainContent();
}

function renderMainContent() {
    const event = events.find(e => e.id === selectedEventId);
    const mainContent = document.getElementById('selectedEvent');
    const emptyState = document.getElementById('emptyState');
    
    if (!event) return;
    
    emptyState.style.display = 'none';
    
    const budgetStatus = event.budget.actual <= event.budget.total 
        ? { text: '✓ On Budget', color: 'text-emerald-600' }
        : { text: '! Over Budget', color: 'text-red-600' };

    mainContent.innerHTML = `
        <div class="border-b border-slate-700 bg-slate-800 sticky top-0 z-10">
            <div class="max-w-6xl mx-auto px-8 py-8">
                <div class="flex items-start justify-between">
                    <div>
                        <h1 class="text-4xl font-light mb-4">${event.name}</h1>
                        <div class="flex gap-6 text-sm text-slate-300">
                            <div>📅 ${formatDate(event.date)}</div>
                            <div>📍 ${event.location}</div>
                            <div class="px-3 py-1 rounded border text-xs border-slate-600">${event.status}</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="border-t border-slate-700 flex max-w-6xl mx-auto">
                ${['overview', 'run-of-show', 'budget', 'tasks', 'vendors'].map(tab => `
                    <button onclick="switchTab('${tab}')" 
                        class="px-6 py-4 text-sm font-medium transition-colors border-b-2 ${
                            currentTab === tab 
                                ? 'border-cyan-400 text-cyan-400' 
                                : 'border-transparent text-slate-400 hover:text-slate-300'
                        }">
                        ${tab.replace('-', ' ').split(' ').map(w => w[0].toUpperCase() + w.slice(1)).join(' ')}
                    </button>
                `).join('')}
            </div>
        </div>

        <div class="max-w-6xl mx-auto px-8 py-8">
            ${currentTab === 'overview' ? `
                <div class="grid grid-cols-3 gap-6 mb-8">
                    <div class="bg-slate-800 border border-slate-700 rounded-lg p-6">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-sm font-medium text-slate-300">Budget Status</h3>
                            <span class="text-lg">💰</span>
                        </div>
                        <div class="mb-4">
                            <div class="text-2xl font-light">$${event.budget.actual.toLocaleString()}</div>
                            <div class="text-xs text-slate-400 mt-1">of $${event.budget.total.toLocaleString()} budgeted</div>
                        </div>
                        <div class="text-sm font-medium ${budgetStatus.color}">${budgetStatus.text}</div>
                    </div>

                    <div class="bg-slate-800 border border-slate-700 rounded-lg p-6">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-sm font-medium text-slate-300">Tasks</h3>
                            <span class="text-lg">✓</span>
                        </div>
                        <div class="mb-4">
                            <div class="text-2xl font-light">${event.tasksCompleted}/${event.tasksTotal}</div>
                            <div class="text-xs text-slate-400 mt-1">${getProgressPercent(event.tasksCompleted, event.tasksTotal)}% complete</div>
                        </div>
                        <div class="w-full bg-slate-700 rounded-full h-2">
                            <div class="bg-cyan-400 h-full rounded-full" style="width: ${getProgressPercent(event.tasksCompleted, event.tasksTotal)}%"></div>
                        </div>
                    </div>

                    <div class="bg-slate-800 border border-slate-700 rounded-lg p-6">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-sm font-medium text-slate-300">Next Deadline</h3>
                            <span class="text-lg">⚠</span>
                        </div>
                        <div class="mb-4">
                            <div class="text-sm font-medium text-amber-300">${formatDate(event.upcomingDeadline)}</div>
                            <div class="text-xs text-slate-400 mt-1">Budget finalization</div>
                        </div>
                        <div class="text-xs text-slate-400">Due in ~5 days</div>
                    </div>
                </div>
            ` : ''}

            ${currentTab === 'run-of-show' ? `
                <div class="space-y-6">
                    <h2 class="text-2xl font-light mb-6">Event Timeline</h2>
                    <div class="space-y-3">
                        ${event.timeline.map((item, idx) => `
                            <div class="flex gap-6 pb-6 border-b border-slate-700 ${idx === event.timeline.length - 1 ? 'border-0' : ''}">
                                <div class="w-24 pt-1">
                                    <div class="font-medium text-cyan-400">${item.time}</div>
                                </div>
                                <div class="flex-1">
                                    <h4 class="font-medium">${item.activity}</h4>
                                    <p class="text-sm text-slate-400 mt-1">${item.owner}</p>
                                    <p class="text-xs text-slate-500 mt-2">${item.notes}</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            ` : ''}

            ${currentTab === 'budget' ? `
                <div class="space-y-6">
                    <h2 class="text-2xl font-light mb-6">Budget Tracker</h2>
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm">
                            <thead>
                                <tr class="border-b border-slate-700">
                                    <th class="text-left py-3 px-4 font-medium text-slate-300">Category</th>
                                    <th class="text-right py-3 px-4 font-medium text-slate-300">Budgeted</th>
                                    <th class="text-right py-3 px-4 font-medium text-slate-300">Actual</th>
                                    <th class="text-right py-3 px-4 font-medium text-slate-300">Variance</th>
                                    <th class="text-left py-3 px-4 font-medium text-slate-300">Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${event.budget_lines.map(item => `
                                    <tr class="border-b border-slate-700 hover:bg-slate-800/50">
                                        <td class="py-4 px-4">${item.category}</td>
                                        <td class="text-right py-4 px-4">$${item.budgeted}</td>
                                        <td class="text-right py-4 px-4">$${item.actual}</td>
                                        <td class="text-right py-4 px-4 text-emerald-400">$${item.budgeted - item.actual}</td>
                                        <td class="py-4 px-4">
                                            <span class="text-xs px-2 py-1 rounded ${item.status === 'on-track' ? 'bg-emerald-900 text-emerald-300' : 'bg-slate-700 text-slate-300'}">
                                                ✓ On Track
                                            </span>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            ` : ''}

            ${currentTab === 'tasks' ? `
                <div class="space-y-4">
                    <h2 class="text-2xl font-light mb-6">Tasks & Checklist</h2>
                    <div class="space-y-3">
                        ${event.tasks.map(task => `
                            <div class="flex items-center gap-4 p-4 bg-slate-800 border border-slate-700 rounded-lg hover:border-slate-600 group">
                                <input type="checkbox" class="w-5 h-5 cursor-pointer">
                                <div class="flex-1">
                                    <h4 class="font-medium">${task.title}</h4>
                                    <p class="text-xs text-slate-400 mt-1">${task.id} • Due ${formatDate(task.due)}</p>
                                </div>
                                <span class="text-xs px-2 py-1 rounded ${task.priority === 'high' ? 'bg-red-900/30 text-red-300' : 'bg-slate-700 text-slate-300'}">
                                    ${task.priority.charAt(0).toUpperCase() + task.priority.slice(1)}
                                </span>
                                <span class="text-xs px-2 py-1 rounded ${task.status === 'in-progress' ? 'bg-cyan-900/30 text-cyan-300' : 'bg-amber-900/30 text-amber-300'}">
                                    ${task.status === 'in-progress' ? 'In Progress' : 'Pending'}
                                </span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            ` : ''}

            ${currentTab === 'vendors' ? `
                <div class="space-y-4">
                    <h2 class="text-2xl font-light mb-6">Vendors & Contacts</h2>
                    <div class="grid grid-cols-2 gap-6">
                        ${event.vendors.map(vendor => `
                            <div class="bg-slate-800 border border-slate-700 rounded-lg p-6">
                                <div class="flex items-start justify-between mb-4">
                                    <div>
                                        <h4 class="font-medium">${vendor.name}</h4>
                                        <p class="text-sm text-slate-400">${vendor.service}</p>
                                    </div>
                                    <span class="text-xs px-2 py-1 rounded ${vendor.status === 'confirmed' ? 'bg-emerald-900 text-emerald-300' : 'bg-amber-900 text-amber-300'}">
                                        ${vendor.status.charAt(0).toUpperCase() + vendor.status.slice(1)}
                                    </span>
                                </div>
                                <div class="space-y-2 text-sm text-slate-300">
                                    <div>📞 ${vendor.contact}</div>
                                    <div>📧 ${vendor.email}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            ` : ''}
        </div>
    `;
}

function switchTab(tab) {
    currentTab = tab;
    renderMainContent();
}

function addEvent() {
    alert('Add Event feature coming soon. For now, edit data directly in the JSON files.');
}

// Initialize
renderEventsList();
renderMainContent();
</script>

</body>
</html>
