<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Planning Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        input, textarea, select { background: #1e293b; border-color: #334155; color: #e2e8f0; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #06b6d4; background: #0f172a; }
        .editable-row { transition: background-color 0.2s; }
        .editable-row:hover { background-color: rgba(30, 41, 59, 0.5); }
    </style>
</head>
<body class="bg-slate-900 text-slate-100">

<div id="app"></div>

<script>
const API_URL = 'http://localhost:3000/api';
let authToken = localStorage.getItem('authToken');
let currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
let events = [];
let selectedEventId = null;
let currentTab = 'overview';
let editingId = null;

// ============ LOGIN ============

function renderLoginScreen() {
  document.getElementById('app').innerHTML = `
    <div class="min-h-screen bg-gradient-to-br from-slate-900 to-slate-800 flex items-center justify-center px-4">
      <div class="max-w-md w-full">
        <div class="bg-slate-800 border border-slate-700 rounded-lg p-8 shadow-2xl">
          <h1 class="text-3xl font-light text-center mb-2">Event Dashboard</h1>
          <p class="text-slate-400 text-center mb-8">Private event planning</p>
          
          <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
              <label class="block text-sm font-medium mb-2">Username</label>
              <input id="loginUsername" type="text" class="w-full px-4 py-2 rounded border" required>
            </div>
            <div>
              <label class="block text-sm font-medium mb-2">Password</label>
              <input id="loginPassword" type="password" class="w-full px-4 py-2 rounded border" required>
            </div>
            <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-700 px-4 py-2 rounded font-medium mt-6">
              Sign In
            </button>
          </form>

          <p id="loginError" class="text-red-400 text-sm mt-4 text-center hidden"></p>

          <div class="mt-8 pt-6 border-t border-slate-700 text-xs text-slate-400 text-center">
            <p><strong>Demo Credentials:</strong></p>
            <p>Username: carrie</p>
            <p>Password: demo123</p>
          </div>
        </div>
      </div>
    </div>
  `;
}

async function handleLogin(event) {
  event.preventDefault();
  
  const username = document.getElementById('loginUsername').value;
  const password = document.getElementById('loginPassword').value;
  const errorEl = document.getElementById('loginError');
  
  try {
    const response = await fetch(`${API_URL}/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });

    if (!response.ok) {
      throw new Error('Invalid username or password');
    }

    const data = await response.json();
    authToken = data.token;
    currentUser = data.user;
    
    localStorage.setItem('authToken', authToken);
    localStorage.setItem('currentUser', JSON.stringify(currentUser));
    
    renderDashboard();
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.classList.remove('hidden');
  }
}

// ============ DASHBOARD ============

async function renderDashboard() {
  if (!authToken) {
    renderLoginScreen();
    return;
  }

  try {
    const response = await fetch(`${API_URL}/events`, {
      headers: { 'Authorization': `Bearer ${authToken}` }
    });

    if (response.status === 401) {
      authToken = null;
      currentUser = null;
      localStorage.removeItem('authToken');
      localStorage.removeItem('currentUser');
      renderLoginScreen();
      return;
    }

    events = await response.json();
    if (!selectedEventId && events.length > 0) {
      selectedEventId = events[0].id;
    }
  } catch (err) {
    console.error('Error fetching events:', err);
  }

  document.getElementById('app').innerHTML = `
    <div class="min-h-screen bg-slate-900 text-slate-100 flex flex-col">
      <header class="border-b border-slate-700 bg-slate-800 px-8 py-6">
        <div class="flex items-center justify-between max-w-7xl mx-auto">
          <h1 class="text-3xl font-light">Event Dashboard</h1>
          <div class="flex items-center gap-4">
            <span class="text-slate-400">Welcome, ${currentUser.username}</span>
            <button onclick="handleLogout()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded text-sm">
              Logout
            </button>
          </div>
        </div>
      </header>

      <div class="flex flex-1 overflow-hidden">
        <aside class="w-72 border-r border-slate-700 bg-slate-800 overflow-y-auto">
          <div class="p-6">
            <h2 class="text-lg font-semibold mb-6">Events</h2>
            <div class="space-y-3">
              ${events.map(event => `
                <button onclick="selectEvent('${event.id}')" 
                  class="w-full text-left p-4 rounded-lg transition-colors ${
                    selectedEventId === event.id 
                      ? 'bg-slate-700 border-l-2 border-cyan-400' 
                      : 'hover:bg-slate-700/50'
                  }">
                  <h3 class="font-medium text-sm">${event.name}</h3>
                  <p class="text-xs text-slate-400 mt-1">${formatDate(event.date)}</p>
                </button>
              `).join('')}
            </div>
          </div>
        </aside>

        <main class="flex-1 overflow-y-auto" id="mainContent"></main>
      </div>
    </div>
  `;

  if (selectedEventId) {
    renderEventDetail();
  }
}

async function renderEventDetail() {
  if (!selectedEventId) return;

  try {
    const response = await fetch(`${API_URL}/events/${selectedEventId}`, {
      headers: { 'Authorization': `Bearer ${authToken}` }
    });

    if (!response.ok) throw new Error('Failed to fetch event');

    const eventData = await response.json();
    const event = eventData.event;
    const tasks = eventData.tasks;
    const budget = eventData.budget;
    const vendors = eventData.vendors;
    const timeline = eventData.timeline;

    const mainContent = document.getElementById('mainContent');
    
    const tasksCompleted = tasks.filter(t => t.status === 'done').length;
    const budgetStatus = event.budget_actual <= event.budget_total 
      ? { text: '✓ On Budget', color: 'text-emerald-600' }
      : { text: '! Over Budget', color: 'text-red-600' };

    mainContent.innerHTML = `
      <div class="fade-in">
        <div class="border-b border-slate-700 bg-slate-800 sticky top-0 z-10">
          <div class="max-w-6xl mx-auto px-8 py-8">
            <h1 class="text-4xl font-light mb-4">${event.name}</h1>
            <div class="flex gap-6 text-sm text-slate-300">
              <div>📅 ${formatDate(event.date)}</div>
              <div>📍 ${event.location}</div>
              <div class="px-3 py-1 rounded border border-slate-600 text-xs">${event.status}</div>
            </div>
          </div>

          <div class="bg-slate-800 border-t border-slate-700 flex max-w-6xl mx-auto">
            ${['overview', 'planning-timeline', 'run-of-show', 'budget', 'tasks', 'vendors'].map(tab => `
              <button onclick="switchTab('${tab}')" 
                class="px-6 py-4 text-sm font-medium transition-colors border-b-2 ${
                  currentTab === tab 
                    ? 'border-cyan-400 text-cyan-400' 
                    : 'border-transparent text-slate-300 hover:text-cyan-300'
                }">
                ${tab.replace('-', ' ').split(' ').map(w => w[0].toUpperCase() + w.slice(1)).join(' ')}
              </button>
            `).join('')}
          </div>
        </div>

        <div class="max-w-6xl mx-auto px-8 py-8">
          ${currentTab === 'overview' ? `
            <div class="grid grid-cols-3 gap-6">
              <div class="bg-slate-800 border border-slate-700 rounded-lg p-6">
                <h3 class="text-sm font-medium text-slate-300 mb-4">Budget</h3>
                <div class="text-2xl font-light">$${event.budget_actual?.toLocaleString() || 0}</div>
                <div class="text-xs text-slate-400">of $${event.budget_total?.toLocaleString() || 0}</div>
                <div class="text-sm font-medium ${budgetStatus.color} mt-4">${budgetStatus.text}</div>
              </div>

              <div class="bg-slate-800 border border-slate-700 rounded-lg p-6">
                <h3 class="text-sm font-medium text-slate-300 mb-4">Tasks</h3>
                <div class="text-2xl font-light">${tasksCompleted}/${tasks.length}</div>
                <div class="text-xs text-slate-400">${Math.round((tasksCompleted / tasks.length) * 100)}% complete</div>
              </div>

              <div class="bg-slate-800 border border-slate-700 rounded-lg p-6">
                <h3 class="text-sm font-medium text-slate-300 mb-4">Vendors</h3>
                <div class="text-2xl font-light">${vendors.length}</div>
                <div class="text-xs text-slate-400">Confirmed: ${vendors.filter(v => v.status === 'confirmed').length}</div>
              </div>
            </div>
          ` : ''}

          ${currentTab === 'planning-timeline' ? renderPlanningTimeline(timeline) : ''}

          ${currentTab === 'run-of-show' ? renderRunOfShow(timeline) : ''}

          ${currentTab === 'budget' ? renderBudget(budget) : ''}

          ${currentTab === 'tasks' ? renderTasks(tasks) : ''}

          ${currentTab === 'vendors' ? renderVendors(vendors) : ''}
        </div>
      </div>
    `;
  } catch (err) {
    console.error('Error rendering event:', err);
    document.getElementById('mainContent').innerHTML = `<div class="p-8 text-red-400">Error loading event</div>`;
  }
}

// ============ PLANNING TIMELINE ============

function renderPlanningTimeline(timeline) {
  // For now, use event timeline data as planning timeline (we'll expand DB schema later)
  const planningData = [
    { id: 1, week: 'Aug 17-23 (THIS WEEK)', focus: 'Email Victor re: Aris (confirmed 8/25); sent all performer contract/invitation emails; replied to Brannon (Boom Unit) on the parade rate; got Bear Roots/Wes/Emily/DJ Mouse contracts from Rob and sent them, plus Hummingbird; sent Victor\'s contract', status: 'done' },
    { id: 2, week: 'Aug 24-26 (pre-trip)', focus: 'Collected rates for most performers and got contracts out (see this week\'s row). Boom Unit\'s $500 parade fee is confirmed by Brannon, pending committee approval', status: 'in-progress' },
    { id: 3, week: 'Aug 27 - Sep 2 (Toronto trip)', focus: 'Blocked out — everything lands before or after it, with urgent items front-loaded into the next 10 days', status: 'pending' },
  ];

  return \`
    <div>
      <h2 class="text-2xl font-light mb-6">Planning Timeline</h2>
      <div class="space-y-3">
        \${planningData.map(item => \`
          <div id="planning-\${item.id}" class="editable-row bg-slate-800 border border-slate-700 rounded-lg p-4">
            \${editingId === \`planning-\${item.id}\` ? \`
              <div class="space-y-3">
                <input id="edit-week-\${item.id}" type="text" value="\${item.week}" placeholder="Week (e.g., Aug 17-23)" class="w-full px-3 py-2 rounded border font-medium">
                <textarea id="edit-focus-\${item.id}" placeholder="Focus & Hard Deadlines" class="w-full px-3 py-2 rounded border h-24">\${item.focus}</textarea>
                <select id="edit-planning-status-\${item.id}" class="w-full px-3 py-2 rounded border">
                  <option value="pending" \${item.status === 'pending' ? 'selected' : ''}>Pending</option>
                  <option value="in-progress" \${item.status === 'in-progress' ? 'selected' : ''}>In Progress</option>
                  <option value="done" \${item.status === 'done' ? 'selected' : ''}>Done</option>
                </select>
                <div class="flex gap-2">
                  <button onclick="savePlanningItem(\${item.id})" class="px-3 py-2 bg-cyan-600 hover:bg-cyan-700 rounded text-sm">Save</button>
                  <button onclick="cancelEdit('planning-\${item.id}')" class="px-3 py-2 bg-slate-600 hover:bg-slate-500 rounded text-sm">Cancel</button>
                </div>
              </div>
            \` : \`
              <div class="flex justify-between items-start">
                <div class="flex-1">
                  <h4 class="font-medium text-cyan-400">\${item.week}</h4>
                  <p class="text-sm text-slate-300 mt-3 leading-relaxed">\${item.focus}</p>
                  <span class="inline-block text-xs px-2 py-1 rounded mt-3 \${
                    item.status === 'done' ? 'bg-emerald-900/30 text-emerald-300' : 
                    item.status === 'in-progress' ? 'bg-cyan-900/30 text-cyan-300' :
                    'bg-amber-900/30 text-amber-300'
                  }">
                    \${item.status.replace('-', ' ')}
                  </span>
                </div>
                <button onclick="startEdit('planning-\${item.id}')" class="px-3 py-1 text-xs bg-slate-700 hover:bg-slate-600 rounded">Edit</button>
              </div>
            \`}
          </div>
        \`).join('')}
      </div>
    </div>
  \`;
}

function renderRunOfShow(timeline) {
  return `
    <div>
      <h2 class="text-2xl font-light mb-6">Event Timeline</h2>
      <div class="space-y-3">
        ${timeline.sort((a, b) => a.sequence - b.sequence).map(item => `
          <div id="timeline-${item.id}" class="editable-row bg-slate-800 border border-slate-700 rounded-lg p-4">
            ${editingId === \`timeline-\${item.id}\` ? `
              <div class="space-y-3">
                <input id="edit-time-${item.id}" type="text" value="${item.time}" placeholder="Time" class="w-full px-3 py-2 rounded border text-sm">
                <input id="edit-activity-${item.id}" type="text" value="${item.activity}" placeholder="Activity" class="w-full px-3 py-2 rounded border">
                <input id="edit-owner-${item.id}" type="text" value="${item.owner}" placeholder="Owner" class="w-full px-3 py-2 rounded border">
                <textarea id="edit-notes-${item.id}" placeholder="Notes" class="w-full px-3 py-2 rounded border h-16">${item.notes || ''}</textarea>
                <div class="flex gap-2">
                  <button onclick="saveTimelineItem(${item.id})" class="px-3 py-2 bg-cyan-600 hover:bg-cyan-700 rounded text-sm">Save</button>
                  <button onclick="cancelEdit('timeline-${item.id}')" class="px-3 py-2 bg-slate-600 hover:bg-slate-500 rounded text-sm">Cancel</button>
                </div>
              </div>
            ` : `
              <div class="flex justify-between items-start">
                <div>
                  <div class="font-medium text-cyan-400">${item.time}</div>
                  <h4 class="font-medium mt-2">${item.activity}</h4>
                  <p class="text-sm text-slate-400 mt-1">${item.owner}</p>
                  <p class="text-xs text-slate-500 mt-2">${item.notes || ''}</p>
                </div>
                <button onclick="startEdit('timeline-${item.id}')" class="px-3 py-1 text-xs bg-slate-700 hover:bg-slate-600 rounded">Edit</button>
              </div>
            `}
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

// ============ BUDGET ============

function renderBudget(budget) {
  return `
    <div>
      <h2 class="text-2xl font-light mb-6">Budget Tracker</h2>
      <div class="space-y-2">
        ${budget.map(item => `
          <div id="budget-${item.id}" class="editable-row bg-slate-800 border border-slate-700 rounded-lg p-4">
            ${editingId === \`budget-\${item.id}\` ? `
              <div class="space-y-3">
                <input id="edit-category-${item.id}" type="text" value="${item.category}" placeholder="Category" class="w-full px-3 py-2 rounded border">
                <div class="grid grid-cols-2 gap-2">
                  <input id="edit-budgeted-${item.id}" type="number" value="${item.budgeted_amount}" placeholder="Budgeted" class="px-3 py-2 rounded border">
                  <input id="edit-actual-${item.id}" type="number" value="${item.actual_amount}" placeholder="Actual" class="px-3 py-2 rounded border">
                </div>
                <select id="edit-status-${item.id}" class="w-full px-3 py-2 rounded border">
                  <option value="on-track" ${item.status === 'on-track' ? 'selected' : ''}>On Track</option>
                  <option value="over-budget" ${item.status === 'over-budget' ? 'selected' : ''}>Over Budget</option>
                  <option value="in-kind" ${item.status === 'in-kind' ? 'selected' : ''}>In-Kind</option>
                </select>
                <div class="flex gap-2">
                  <button onclick="saveBudgetItem(${item.id})" class="px-3 py-2 bg-cyan-600 hover:bg-cyan-700 rounded text-sm">Save</button>
                  <button onclick="cancelEdit('budget-${item.id}')" class="px-3 py-2 bg-slate-600 hover:bg-slate-500 rounded text-sm">Cancel</button>
                </div>
              </div>
            ` : `
              <div class="flex justify-between items-center">
                <div class="flex-1">
                  <h4 class="font-medium">${item.category}</h4>
                  <div class="text-sm text-slate-400 mt-1">\$${item.budgeted_amount} budgeted / \$${item.actual_amount} actual</div>
                  <div class="text-xs text-slate-500 mt-1">\$${item.budgeted_amount - item.actual_amount} remaining</div>
                </div>
                <button onclick="startEdit('budget-${item.id}')" class="px-3 py-1 text-xs bg-slate-700 hover:bg-slate-600 rounded">Edit</button>
              </div>
            `}
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

// ============ TASKS ============

function renderTasks(tasks) {
  return `
    <div>
      <h2 class="text-2xl font-light mb-6">Tasks</h2>
      <div class="space-y-2">
        ${tasks.map(task => `
          <div id="task-${task.id}" class="editable-row bg-slate-800 border border-slate-700 rounded-lg p-4">
            ${editingId === \`task-\${task.id}\` ? `
              <div class="space-y-3">
                <input id="edit-title-${task.id}" type="text" value="${task.title}" placeholder="Task title" class="w-full px-3 py-2 rounded border">
                <div class="grid grid-cols-2 gap-2">
                  <select id="edit-status-${task.id}" class="px-3 py-2 rounded border">
                    <option value="pending" ${task.status === 'pending' ? 'selected' : ''}>Pending</option>
                    <option value="in-progress" ${task.status === 'in-progress' ? 'selected' : ''}>In Progress</option>
                    <option value="done" ${task.status === 'done' ? 'selected' : ''}>Done</option>
                  </select>
                  <select id="edit-priority-${task.id}" class="px-3 py-2 rounded border">
                    <option value="low" ${task.priority === 'low' ? 'selected' : ''}>Low</option>
                    <option value="medium" ${task.priority === 'medium' ? 'selected' : ''}>Medium</option>
                    <option value="high" ${task.priority === 'high' ? 'selected' : ''}>High</option>
                  </select>
                </div>
                <input id="edit-duedate-${task.id}" type="date" value="${task.due_date}" class="w-full px-3 py-2 rounded border">
                <input id="edit-owner-${task.id}" type="text" value="${task.owner}" placeholder="Owner" class="w-full px-3 py-2 rounded border">
                <div class="flex gap-2">
                  <button onclick="saveTaskItem(${task.id})" class="px-3 py-2 bg-cyan-600 hover:bg-cyan-700 rounded text-sm">Save</button>
                  <button onclick="cancelEdit('task-${task.id}')" class="px-3 py-2 bg-slate-600 hover:bg-slate-500 rounded text-sm">Cancel</button>
                </div>
              </div>
            ` : `
              <div class="flex justify-between items-start">
                <div class="flex-1">
                  <h4 class="font-medium">${task.title}</h4>
                  <p class="text-sm text-slate-400 mt-1">${task.owner}</p>
                  <div class="flex gap-2 mt-2">
                    <span class="text-xs px-2 py-1 rounded ${task.priority === 'high' ? 'bg-red-900/30 text-red-300' : 'bg-slate-700 text-slate-300'}">
                      ${task.priority}
                    </span>
                    <span class="text-xs px-2 py-1 rounded ${task.status === 'done' ? 'bg-emerald-900/30 text-emerald-300' : 'bg-amber-900/30 text-amber-300'}">
                      ${task.status}
                    </span>
                  </div>
                </div>
                <button onclick="startEdit('task-${task.id}')" class="px-3 py-1 text-xs bg-slate-700 hover:bg-slate-600 rounded">Edit</button>
              </div>
            `}
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

// ============ VENDORS ============

function renderVendors(vendors) {
  return `
    <div>
      <h2 class="text-2xl font-light mb-6">Vendors</h2>
      <div class="grid grid-cols-2 gap-4">
        ${vendors.map(vendor => `
          <div id="vendor-${vendor.id}" class="editable-row bg-slate-800 border border-slate-700 rounded-lg p-4">
            ${editingId === \`vendor-\${vendor.id}\` ? `
              <div class="space-y-3">
                <input id="edit-name-${vendor.id}" type="text" value="${vendor.name}" placeholder="Vendor name" class="w-full px-3 py-2 rounded border">
                <input id="edit-service-${vendor.id}" type="text" value="${vendor.service}" placeholder="Service" class="w-full px-3 py-2 rounded border">
                <input id="edit-phone-${vendor.id}" type="text" value="${vendor.contact_phone || ''}" placeholder="Phone" class="w-full px-3 py-2 rounded border">
                <input id="edit-email-${vendor.id}" type="email" value="${vendor.contact_email || ''}" placeholder="Email" class="w-full px-3 py-2 rounded border">
                <select id="edit-vendor-status-${vendor.id}" class="w-full px-3 py-2 rounded border">
                  <option value="pending" ${vendor.status === 'pending' ? 'selected' : ''}>Pending</option>
                  <option value="confirmed" ${vendor.status === 'confirmed' ? 'selected' : ''}>Confirmed</option>
                  <option value="completed" ${vendor.status === 'completed' ? 'selected' : ''}>Completed</option>
                </select>
                <div class="flex gap-2">
                  <button onclick="saveVendorItem(${vendor.id})" class="px-3 py-2 bg-cyan-600 hover:bg-cyan-700 rounded text-sm">Save</button>
                  <button onclick="cancelEdit('vendor-${vendor.id}')" class="px-3 py-2 bg-slate-600 hover:bg-slate-500 rounded text-sm">Cancel</button>
                </div>
              </div>
            ` : `
              <div class="flex justify-between items-start">
                <div>
                  <h4 class="font-medium">${vendor.name}</h4>
                  <p class="text-sm text-slate-400">${vendor.service}</p>
                  <div class="text-sm text-slate-300 mt-2">
                    <div>📞 ${vendor.contact_phone || 'N/A'}</div>
                    <div>📧 ${vendor.contact_email || 'N/A'}</div>
                  </div>
                  <span class="inline-block text-xs px-2 py-1 rounded mt-2 ${
                    vendor.status === 'confirmed' ? 'bg-emerald-900 text-emerald-300' : 'bg-amber-900 text-amber-300'
                  }">
                    ${vendor.status}
                  </span>
                </div>
                <button onclick="startEdit('vendor-${vendor.id}')" class="px-3 py-1 text-xs bg-slate-700 hover:bg-slate-600 rounded">Edit</button>
              </div>
            `}
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

// ============ EDIT FUNCTIONS ============

function startEdit(id) {
  editingId = id;
  renderEventDetail();
}

function cancelEdit(id) {
  editingId = null;
  renderEventDetail();
}

async function savePlanningItem(id) {
  const week = document.getElementById(`edit-week-${id}`).value;
  const focus = document.getElementById(`edit-focus-${id}`).value;
  const status = document.getElementById(`edit-planning-status-${id}`).value;

  // This would save to database when deployed

// ============ HELPERS ============

function formatDate(dateStr) {
  return new Date(dateStr).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function selectEvent(eventId) {
  selectedEventId = eventId;
  currentTab = 'overview';
  renderEventDetail();
}

function switchTab(tab) {
  currentTab = tab;
  editingId = null;
  renderEventDetail();
}

function handleLogout() {
  authToken = null;
  currentUser = null;
  localStorage.removeItem('authToken');
  localStorage.removeItem('currentUser');
  renderLoginScreen();
}

// Initialize
if (authToken && currentUser) {
  renderDashboard();
} else {
  renderLoginScreen();
}
